name: Bug report
description: Report a gameplay, performance or setup problem with a HarleyVR build.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please identify the build you played. Do not attach ROMs, save states or personal information."
  - type: input
    id: version
    attributes:
      label: Release version or test build
      placeholder: Release version or the name of the test build you launched
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Headset, runtime and PC
      description: Include CPU, GPU, Windows version and render resolution if known.
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Headset render preset
      options:
        - Performance
        - Balanced
        - Quality
        - Not sure
    validations:
      required: true
  - type: input
    id: refresh
    attributes:
      label: Headset refresh rate (Hz)
      description: If known, enter the headset refresh rate selected in SteamVR or Meta.
      placeholder: e.g. 80, 90 or 120
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and how can it be reproduced?
      description: Include rider, location and whether the problem affects the whole view or specific objects.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshot, short clip or reviewed log excerpt
      description: Remove personal information. Do not attach ROMs or save states.
