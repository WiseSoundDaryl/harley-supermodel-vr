# Replaces the inherited auto-publish workflow while HarleyVR is prepared.
# No push trigger, token write permission, artifact upload or release creation.
name: HarleyVR release preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release status
        run: |
          echo "HarleyVR release preparation is incomplete."
          echo "See Docs/RELEASE-CHECKLIST.md and Docs/BUILDING.md."
          echo "This workflow intentionally does not build or publish a player package."
          exit 1
