name: HarleyVR source integrity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harleyvr-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notices-and-syntax:
    name: Source integrity and synthetic launcher checks
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve recorded file bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure checkout line endings.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure checkout line endings.' }

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify notices and audited source subset
        run: |
          $result = & ./packaging/Test-ReleaseNotices.ps1 -Root . -SourceRoot .
          if (-not $result.Passed -or -not $result.ImGuiSourceChecked -or $result.ImGuiSourceBlobs -ne 15 -or
              -not $result.RecordedSourceSubsetChecked -or $result.VerifiedRecordedSourceReferences -ne 15 -or
              $result.PendingRecordedSourceReferences -ne 3 -or $result.AllRecordedSourcesVerified -ne $false -or
              @($result.RecordedSourceFindings).Count -ne 3) {
            throw 'Notice, ImGui and audited source-subset verification did not complete.'
          }
          $result | Format-List
          Write-Warning 'Three recorded CPU/sound source identities remain unresolved; the audited subset does not verify them.'
          $result.RecordedSourceFindings | Format-List

      - name: Exercise recorded source-identity fixtures
        run: |
          $result = & ./packaging/Test-VendoredSourceIdentitiesFixtures.ps1
          if (-not $result.Passed -or -not $result.SyntheticOnly -or -not $result.FixturesRemoved -or
              $result.FilesModified -ne $false -or $result.Cases -le 0 -or $result.Checks -le 0) {
            throw 'Recorded source-identity regression fixtures did not complete safely.'
          }
          $result | Format-List

      - name: Parse tracked PowerShell scripts
        run: ./packaging/Test-SourceSyntax.ps1 -Root . | Format-List

      - name: Check source-distribution policy
        run: |
          $result = & ./packaging/Test-SourceSafety.ps1 -Root .
          if (-not $result.Passed -or -not $result.StagedBlobsChecked -or $result.FilesChecked -le 0) {
            throw 'Staged source-distribution verification did not complete.'
          }
          $result | Format-List

      - name: Exercise source-policy fixtures
        run: |
          $result = & ./packaging/Test-SourceSafetyFixtures.ps1
          if (-not $result.Passed -or -not $result.SyntheticOnly -or -not $result.FixtureCleanup -or
              $result.Cases -le 0 -or $result.Checks -le 0) {
            throw 'Synthetic source-policy fixtures did not complete.'
          }
          $result | Format-List

      - name: Exercise synthetic Meta ASW recovery
        run: |
          $result = & ./packaging/Test-MetaAswRecovery.ps1
          if (-not $result.Passed -or $result.Cases -le 0 -or $result.Checks -le 0 -or $result.NativeBoundaryAttempts -ne 0 -or
              $result.RealMetaContacted -or $result.RealASWChanged -or -not $result.TemporaryFilesRemoved) {
            throw 'Synthetic ASW recovery checks did not complete safely.'
          }
          $result | Format-List

      - name: Exercise synthetic launcher preflight
        run: |
          $result = & ./packaging/Test-LauncherPreflight.ps1
          if (-not $result.Passed -or $result.Cases -le 0 -or $result.Checks -le 0 -or
              $result.SentinelProbesBlocked -le 0 -or $result.ForbiddenActionsReachedDuringPreflight -ne 0 -or
              $result.GameLaunched -or $result.RuntimeLoaded -or $result.AswQueriedOrChanged -or -not $result.FixturesRemoved) {
            throw 'Synthetic launcher preflight checks did not complete safely.'
          }
          $result | Format-List

      - name: Record check scope
        run: |
          @'
          ## Source integrity checks passed

          Verified recorded notice hashes, the 15 recorded ImGui source identities,
          an audited subset of 15 manifest source references, tracked PowerShell
          syntax, and the staged source-distribution policy. The source sets overlap.
          Three CPU/sound manifest references remain unresolved and are not verified
          by this green check. Their recorded hashes remain unchanged; see
          Docs/RECORDED-SOURCE-VERIFICATION.md for the findings and strict-check scope.

          Synthetic regression tests exercised recorded source identities,
          source-policy rejection, Meta ASW recovery, and both launcher preflight
          routes using disposable fixtures.

          Tests use inert payloads and mocked process/runtime/diagnostic boundaries.
          They never invoke the installed Meta diagnostic tool or change real ASW.

          These checks do not establish a clean HarleyVR build, complete
          corresponding source, dependency provenance, legal clearance, physical
          headset compatibility or release readiness. No emulator, ROM, headset
          test, player packaging or publication runs in this workflow. The source
          policy checks the current index, not every historical Git object or all
          possible encoded private data.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
